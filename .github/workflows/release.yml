name: website-react-pf release

on:
  push:
    branches: [release/v*]

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:

  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.extract_version.outputs.version }}
      branch_name: ${{ github.event.ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Extract & Validate Tag
        id: extract_version
        run: |
          BRANCH_NAME="${{ github.event.ref }}"
          VERSION="${BRANCH_NAME#release/}"
          
          echo "Branch created: ${BRANCH_NAME}"
          echo "Checking for tag: ${VERSION}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error:: Tag '$VERSION' already exists in this repository!"
            exit 1
          fi

          echo "Tag '$VERSION' is available!"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  deploy-prod:
    name: Deploy Prod
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install Backend Dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python - --version 2.2.1
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.in-project true
          cd serverless/website-pf
          poetry install

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd webapp/website-pf
          npm install

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::890384337971:role/github-pipeline-access
          aws-region: us-east-1

      - name: Run Deploy
        run: |
          aws sts get-caller-identity
          ./deploy.sh prod

  release-version:
    name: Release Version
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate-version.outputs.branch_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git Tag & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate-version.outputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

          gh release create "$TAG_NAME" --title "Release $TAG_NAME" --generate-notes

      - name: Delete Release Branch
        run: |
          BRANCH_NAME="${{ needs.validate-version.outputs.branch_name }}"
          echo "Deleting remote branch: $BRANCH_NAME"
          git push origin --delete "$BRANCH_NAME"
