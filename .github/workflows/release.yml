name: website-react-pf release

on:
  push:
    branches: [release/v*]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  deploy-prod:
    name: Deploy Prod
    needs: scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install Backend Dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python - --version 2.2.1
          export PATH="/home/runner/.local/bin:$PATH"
          poetry config virtualenvs.in-project true
          cd serverless/website-pf
          poetry install

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd webapp/website-pf
          npm install

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::890384337971:role/github-pipeline-access
          aws-region: us-east-1

      - name: Run Deploy
        run: |
          aws sts get-caller-identity
          ./deploy.sh prod

  # TODO: Add a job to create a release in GitHub and delete release branch.
